name: Daily Swing-Trading Scan

on:
  schedule:
    # 22:00 UTC, Mo-Fr – liegt sicher nach US-Marktschluss
    # (NYSE-Schluss ist 21:00 UTC im Winter (EST) bzw. 20:00 UTC im Sommer (EDT))
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main

      - name: Commit report
        run: |
          git config user.name "trading-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ site/
          git diff --cached --quiet || git commit -m "Update daily scan report"
          git push
