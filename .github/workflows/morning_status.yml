name: Morning Status

on:
  # No schedule: GitHub starts cron runs hours late (observed 4-8 h), so the 08:00 check in src.status
  # skipped them. The NAS triggers this workflow at 08:00 Berlin time via the GitHub API
  # (workflow_dispatch), see docs/nas-morning-trigger.md.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # A manual run always sends, regardless of the time of day.
        run: python -m src.status ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
