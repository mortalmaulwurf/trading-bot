# Zentrale Konfiguration für den Swing-Trading-Scanner.
# Werte hier ändern wirkt sich beim nächsten Lauf sofort aus, kein Code-Änderung nötig.

risk:
  total_capital_eur: 300
  # Hard cap for the capital put into a single position (one position at a time).
  max_position_eur: 300
  max_risk_per_trade_eur: 10
  # Leverage is not fixed: it is chosen per trade as the highest leverage whose
  # knock-out barrier is still at least (1 + ko_buffer) * stop distance away,
  # capped at max_leverage.
  ko_buffer: 0.5
  max_leverage: 10
  # finanzen.net zero: orders below the free-volume threshold cost a flat fee per order.
  fee_per_order_eur: 1.0
  min_free_order_volume_eur: 500
  # Assumed round-trip spread in % of the certificate price. Replace with the real value from the app.
  spread_pct: 0.5
  # true: the max risk budget includes fees and spread (strict); false: costs on top.
  risk_includes_costs: true
  # Net risk/reward (after fees and spread) needed to raise an alert / to be labelled "A-Setup".
  min_net_crv: 2.0
  a_setup_net_crv: 3.0
  # Stop reference: hit level minus this multiple of the daily ATR.
  atr_period: 14
  stop_atr_multiple: 1.0

analysis:
  # Wie viele Kalendertage Daily-Historie für das Volumenprofil geladen werden
  lookback_days_daily: 180
  # Intraday-Timeframe für die Timing-Komponente (yfinance: z.B. "1h")
  intraday_interval: "1h"
  # yfinance erlaubt "1h" nur für die letzten ~730 Tage; 60 Tage reichen für Timing völlig aus
  intraday_lookback_days: 60
  # Ab welchem Abstand (in %) zu POC/VAL ein Ticker als "Treffer" gilt
  proximity_threshold_pct: 1.5
  # Anteil des Volumens, der die Value Area (zwischen VAL und VAH) definiert
  value_area_pct: 70
  # Anzahl Preis-Bins für die Volumenprofil-Berechnung
  volume_profile_bins: 30
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  # Volumen-Spike: letztes Tagesvolumen >= Durchschnitt der letzten N Tage * Multiplikator
  volume_spike_multiplier: 1.5
  volume_spike_lookback: 20
  # Langfristiges Volumenprofil (zusätzlich zum obigen lookback_days_daily),
  # um zu prüfen, ob kurz- und langfristige Levels übereinstimmen (Konfluenz)
  lookback_days_long: 365
  # Ab welchem Abstand (in %) ein kurzfristiges Level und ein langfristiges
  # Level als "übereinstimmend" gelten
  confluence_threshold_pct: 2.0
  # Anzahl Wochen für den gleitenden Durchschnitt des Wochentrend-Filters
  weekly_trend_sma_periods: 10
  # Vorlauf (in Tagen), in dem nach bevorstehenden Quartalszahlen/Makro-Terminen gesucht wird
  upcoming_events_days_ahead: 7

notifications:
  # Telegram only fires for hits with at least this many confirmations (of 3)
  # AND a net risk/reward >= risk.min_net_crv. Everything else stays in the report.
  min_confirmations: 2
  # Optionale URL der gehosteten HTML-Übersichtsseite (z.B. Render Static
  # Site, siehe README "Online-Übersicht"). Wird an Telegram-Nachrichten
  # angehängt, falls gesetzt. Leer lassen, wenn (noch) nicht gehostet.
  site_url: "https://trading-bot-cqjb.onrender.com"

schedule:
  # Informativ – der tatsächliche Zeitplan steht in .github/workflows/daily_analysis.yml
  cron_utc: "0 22 * * 1-5"
