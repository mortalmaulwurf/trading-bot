# Watchlist für den Swing-Trading-Scanner.
# symbol: muss dem Yahoo-Finance-Symbol entsprechen:
#   - US-Aktien: normales Kürzel, z.B. PG, WMT, MCD
#   - Nicht-US-Börsen brauchen ein Suffix, z.B. RWE an der Xetra = "RWE.DE"
#   - Futures: Kürzel + "=F", z.B. Gold "GC=F", WTI-Rohöl "CL=F"
# name: frei wählbarer Klarname, erscheint in Report/Telegram statt/neben
#   dem kryptischen Symbol. Weglassen ist ok, dann wird das Symbol angezeigt.
#
# Neue Einträge einfach ergänzen. Der Scanner (Volumenprofil, RSI,
# Schwellenwerte in %) funktioniert unverändert für jeden Ticker-Typ.

tickers:
  # Einzelaktien - pausiert (Fokus aktuell auf Indizes und Rohstoffe).
  # Zum Reaktivieren die Kommentarzeichen entfernen.
  # - symbol: PG
  #   name: "Procter & Gamble"
  # - symbol: WMT
  #   name: "Walmart"
  # - symbol: MCD
  #   name: "McDonald's"
  # - symbol: RWE.DE
  #   name: "RWE"

  # Große Indizes – als liquide ETFs abgebildet, da Index-Ticker (^GSPC etc.)
  # bei yfinance kein verlässliches Handelsvolumen liefern, das Volumenprofil
  # aber echtes Volumen braucht.
  # index_symbol (optional): Basis fuer die Umrechnung der ETF-Level in Indexwerte,
  # weil die Knock-out-Zertifikate auf den Index laufen.
  # Nasdaq 100 (QQQ) war zwischenzeitlich entfernt, weil er eng mit dem S&P 500 laeuft. Seit
  # 2026-10-29 wieder dabei (Beobachtung; die Regel "eine Position gleichzeitig" bleibt bestehen,
  # also nicht zwei stark korrelierte Aktienindizes gleichzeitig handeln).
  # Nikkei 225 als Asien-Index: ETF 1321.T (Nomura, liquideste Nikkei-ETF an der Tokioter Boerse,
  # Kurse in JPY). Die Boerse schliesst um 07:00 Uhr deutscher Zeit, der Abendscan sieht den
  # abgeschlossenen Tag.
  - symbol: SPY
    name: "S&P 500"
    index_symbol: "^GSPC"
  - symbol: QQQ
    name: "Nasdaq 100"
    index_symbol: "^NDX"
  - symbol: EXS1.DE
    name: "DAX"
    index_symbol: "^GDAXI"
  - symbol: 1321.T
    name: "Nikkei 225"
    index_symbol: "^N225"

  # Rohstoffe – als Frontmonat-Futures, weil deren Handelsvolumen die
  # tatsächliche Marktaktivität widerspiegelt (Standard-Basis für
  # Volumenprofil-Analysen bei Gold/Öl, z.B. auch auf TradingView üblich).
  - symbol: GC=F
    name: "Gold"
  - symbol: CL=F
    name: "WTI-Rohöl"
